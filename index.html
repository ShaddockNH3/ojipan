<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#000;}
  body{transition:background .2s ease;}

  /* ---------- 丑版 ---------- */
  #ui-ugly{
    position:fixed;inset:0;
    background-color:#000;
    background-image:
      radial-gradient(circle at 50% 34%, #4a0a78 0%, #1a0028 40%, #000 74%),
      repeating-linear-gradient(45deg, rgba(255,215,0,.055) 0 2px, transparent 2px 15px);
    font-family:"Comic Sans MS","Chalkboard SE","PingFang SC",Impact,sans-serif;
    color:#ffd700;cursor:crosshair;
    user-select:none;-webkit-user-select:none;
  }
  body.mode-clean #ui-ugly{display:none;}

  #title{
    position:absolute;top:12px;left:0;right:0;margin:0;text-align:center;
    font-size:50px;font-style:italic;letter-spacing:5px;
    color:#ffd700;-webkit-text-stroke:2px #a020f0;
    text-shadow:4px 4px 0 #6a0dad, 9px 9px 0 #000, 0 0 34px #b06cff;
    transform:rotate(-2deg);z-index:6;pointer-events:none;
  }
  #ticker{
    position:absolute;top:94px;left:0;right:0;height:32px;overflow:hidden;
    background:repeating-linear-gradient(90deg,#2a0044 0 18px,#170029 18px 36px);
    border-top:3px double #ffd700;border-bottom:3px double #ffd700;
    font-size:14px;letter-spacing:2px;color:#b06cff;white-space:nowrap;z-index:5;
  }
  #ticker span{display:inline-block;padding-left:100%;animation:roll 18s linear infinite;}
  @keyframes roll{from{transform:translateX(0);}to{transform:translateX(-100%);}}
  body.snap #ticker span{animation-delay:-7s;}
  body.snap .pop{animation:none;opacity:.9;transform:translate(-50%,-50%) rotate(-7deg);}

  #orange{
    position:absolute;left:50%;top:47%;width:186px;height:186px;
    margin:-93px 0 0 -93px;border-radius:50%;
    border:9px ridge #ffd700;
    background:repeating-conic-gradient(from 0deg,#b06cff 0 18deg,#ffd700 18deg 36deg);
    font-size:94px;line-height:1;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 0 0 7px #000, 0 0 44px #a020f0, inset 0 0 60px #000;
    cursor:pointer;z-index:2;outline:none;
    animation:wob 2.4s ease-in-out infinite;
  }
  #orange:active{box-shadow:0 0 0 7px #ffd700, 0 0 80px #ffd700, inset 0 0 70px #000;}
  @keyframes wob{
    0%,100%{transform:rotate(-5deg) scale(1);}
    50%{transform:rotate(5deg) scale(1.07);}
  }
  #hint{
    position:absolute;left:50%;top:calc(47% + 118px);transform:translateX(-50%) rotate(-3deg);
    font-size:19px;font-style:italic;letter-spacing:2px;color:#ffd700;
    -webkit-text-stroke:1px #000;text-shadow:2px 2px 0 #a020f0;
    animation:hop 1.1s ease-in-out infinite;z-index:5;pointer-events:none;
  }
  @keyframes hop{
    0%,100%{transform:translateX(-50%) rotate(-3deg) translateY(0);}
    50%{transform:translateX(-50%) rotate(3deg) translateY(-7px);}
  }
  .deco{position:absolute;font-size:46px;opacity:.5;filter:drop-shadow(0 0 10px #a020f0);z-index:1;pointer-events:none;}
  #bar{
    position:absolute;left:0;right:0;bottom:0;height:48px;z-index:10;
    background:repeating-linear-gradient(90deg,#2a0044 0 10px,#3d0061 10px 20px);
    border-top:4px dashed #ffd700;
    display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 14px;
    font-family:"Courier New",monospace;font-size:15px;font-weight:bold;color:#ffd700;
    text-shadow:1px 1px 0 #000;
  }
  #stats{letter-spacing:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  #stats b{color:#b06cff;font-size:19px;}
  .bar-btns{display:flex;gap:8px;flex-shrink:0;}
  .ugly-btn{
    font-family:"Comic Sans MS","PingFang SC",sans-serif;font-size:15px;font-style:italic;
    padding:5px 14px;cursor:pointer;color:#ffd700;
    background:repeating-linear-gradient(45deg,#3d0061 0 6px,#6a0dad 6px 12px);
    border:4px ridge #ffd700;border-radius:0;
    box-shadow:3px 3px 0 #000, inset 0 0 14px #000;
    transform:rotate(2deg);white-space:nowrap;
  }
  .ugly-btn:hover{transform:rotate(-3deg) scale(1.08);color:#fff;}
  .ugly-btn:active{transform:translate(2px,2px) rotate(1deg);box-shadow:none;}

  /* ---------- 好看版 ---------- */
  #ui-clean{
    position:fixed;inset:0;display:none;
    grid-template-rows:auto 1fr auto;
    padding:24px 30px 26px;
    background:#FDFBF7;color:#1C1917;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif;
    cursor:default;user-select:none;-webkit-user-select:none;
  }
  body.mode-clean #ui-clean{display:grid;}
  body.mode-clean{background:#FDFBF7;}
  .c-head{display:flex;align-items:center;justify-content:space-between;}
  .c-logo{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500;letter-spacing:-0.01em;}
  .c-dot{width:16px;height:16px;border-radius:50%;background:#EF9F27;display:block;}
  .c-actions{display:flex;gap:8px;align-items:center;}
  .c-pill{
    font:inherit;font-size:11px;color:#A8A29E;background:#F3EFE7;border:0;
    padding:4px 11px;border-radius:20px;cursor:pointer;text-decoration:none;
    transition:background .15s ease,color .15s ease;
  }
  .c-pill:hover{background:#EBE5DA;color:#1C1917;}
  .c-mid{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0;}
  .c-mid h1{
    font-size:30px;font-weight:500;margin:0;letter-spacing:-0.02em;
    color:#1C1917;
  }
  .c-sub{font-size:13px;color:#B3ACA2;margin:8px 0 0;letter-spacing:0.01em;}
  #c-orange{
    position:relative;width:96px;height:96px;margin:34px 0 0;padding:0;
    border:0;background:none;cursor:pointer;
    transition:transform .18s cubic-bezier(.34,1.56,.64,1);
    animation:breathe 4s ease-in-out infinite;
  }
  #c-orange:hover{transform:scale(1.06);}
  #c-orange:active{transform:scale(.95);}
  @keyframes breathe{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-4px);}
  }
  .c-body{position:absolute;inset:0;border-radius:50%;background:#EF9F27;display:block;}
  .c-shine{position:absolute;left:14px;top:16px;width:24px;height:17px;border-radius:50%;background:#F7C677;display:block;}
  .c-leaf{position:absolute;left:58px;top:-8px;width:18px;height:10px;border-radius:50%;background:#97C459;transform:rotate(-26deg);display:block;}
  .c-shadow{width:68px;height:7px;border-radius:50%;background:#EFEAE1;margin:10px 0 0;}
  .c-tip{font-size:11px;color:#C9C1B5;letter-spacing:0.08em;margin:16px 0 0;}
  .c-ground{position:absolute;left:0;right:0;bottom:118px;height:1px;background:#F0E9DE;pointer-events:none;}
  .c-foot{padding-top:6px;}
  .c-meter-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:7px;}
  .c-meter-head span:first-child{font-size:11px;color:#B3ACA2;letter-spacing:0.05em;}
  .c-meter-head span:last-child{font-size:12px;font-weight:500;color:#1C1917;}
  .c-track{height:5px;border-radius:3px;background:#EFEAE1;overflow:hidden;}
  #c-fill{height:100%;width:0;border-radius:3px;background:#EF9F27;transition:width .25s ease;}
  .c-foot-row{display:flex;justify-content:space-between;align-items:center;margin-top:9px;}
  .c-foot-row span{font-size:11px;color:#C0B8AC;}
  #c-clear{
    font:inherit;font-size:11px;color:#C0B8AC;background:none;border:0;padding:0;
    cursor:pointer;transition:color .15s ease;
  }
  #c-clear:hover{color:#1C1917;}

  /* ---------- 共用层 ---------- */
  #sky{position:fixed;inset:0;pointer-events:none;z-index:4;overflow:hidden;}
  .bread{position:absolute;line-height:1;will-change:left,top,transform;transform-origin:50% 50%;}
  .bread .bd-e{display:block;}
  .bread svg{display:none;}
  body.mode-ugly .bread{
    filter:drop-shadow(0 0 10px rgba(255,215,0,.85)) drop-shadow(0 0 22px rgba(160,32,240,.6));
  }
  body.mode-clean .bread{
    filter:drop-shadow(0 2px 3px rgba(28,25,23,.10));
  }
  body.mode-clean .bread .bd-e{display:none;}
  body.mode-clean .bread svg{display:block;}

  .pop{
    position:absolute;font-size:20px;font-style:italic;color:#ffd700;white-space:nowrap;
    -webkit-text-stroke:1px #000;text-shadow:2px 2px 0 #a020f0;
    z-index:98;pointer-events:none;animation:popup .95s ease-out forwards;
  }
  @keyframes popup{
    0%{opacity:1;transform:translate(-50%,-50%) scale(.5) rotate(-10deg);}
    100%{opacity:0;transform:translate(-50%,-160%) scale(1.8) rotate(14deg);}
  }
  .flash{
    position:fixed;left:50%;bottom:20%;z-index:300;pointer-events:none;
    font-family:"Comic Sans MS","PingFang SC",sans-serif;font-size:21px;
    color:#ffd700;-webkit-text-stroke:1px #000;text-shadow:2px 2px 0 #a020f0;
    animation:flashIn 1.9s ease-out forwards;
  }
  @keyframes flashIn{
    0%{opacity:0;transform:translate(-50%,12px) rotate(-3deg);}
    14%{opacity:1;transform:translate(-50%,0) rotate(1deg);}
    78%{opacity:1;}
    100%{opacity:0;transform:translate(-50%,-16px) rotate(-1deg);}
  }

  /* ---------- 弹窗 ---------- */
  #modal{
    position:fixed;inset:0;z-index:900;display:none;
    align-items:center;justify-content:center;
    background:rgba(6,0,12,.62);
  }
  #modal.show{display:flex;animation:fadeIn .16s ease-out;}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .m-box{
    width:min(424px,88vw);background:#070707;border:5px solid #FFD700;
    padding:22px 26px 20px;text-align:center;
    transform:rotate(-1.5deg);animation:mIn .22s cubic-bezier(.2,1.6,.5,1);
    box-shadow:0 0 0 6px #000, 0 0 50px rgba(160,32,240,.55);
  }
  @keyframes mIn{from{transform:rotate(-4deg) scale(.9);}to{transform:rotate(-1.5deg) scale(1);}}
  .m-title{
    font-family:"Comic Sans MS","PingFang SC",cursive;font-size:27px;color:#FFD700;
    margin:0;letter-spacing:2px;text-shadow:3px 3px 0 #A020F0;
  }
  .m-sub{
    font-family:"Courier New",monospace;font-size:11px;color:#B06CFF;
    letter-spacing:0.16em;margin:9px 0 0;
  }
  .m-ask{
    font-family:"Comic Sans MS","PingFang SC",cursive;font-size:15px;color:#FFD700;
    margin:17px 0 19px;
  }
  .m-btns{display:flex;gap:12px;justify-content:center;}
  .m-btn{
    font-family:"Comic Sans MS","PingFang SC",cursive;font-size:15px;
    padding:8px 28px;cursor:pointer;border:4px ridge #FFD700;
  }
  .m-yes{background:#FFD700;color:#3D0061;}
  .m-no{background:#3D0061;color:#FFD700;}
  .m-btn:hover{filter:brightness(1.15);}
  .m-btn:active{transform:translate(1px,1px);}

  /* ---------- 换台幕布 ---------- */
  #veil{
    position:fixed;inset:0;z-index:800;opacity:0;pointer-events:none;
    transition:opacity .17s ease;
  }
  #veil.on{opacity:1;}
  #veil.veil-light{background:#FDFBF7;}
  #veil.veil-dark{background:#000;}

  body.crash #ui-clean{animation:crashAnim .3s steps(3) 1;}
  @keyframes crashAnim{
    0%{transform:translate(0,0) rotate(0);}
    30%{transform:translate(-7px,4px) rotate(-.6deg);}
    60%{transform:translate(6px,-5px) rotate(.5deg);}
    100%{transform:translate(0,0) rotate(0);}
  }
</style>
</head>
<body class="mode-ugly">

<div id="ui-ugly">
  <h1 id="title">★ 面 包 发 射 器 ★</h1>
  <div id="ticker"><span>滴 滴 滴 ・ 面 包 已 上 膛 ・ 点 击 橙 子 立 即 发 射 ・ 后 果 自 负 ・ 本 产 品 不 提 供 任 何 保 险 ・ 请 勿 对 准 邻 居 ・ 已 经 报 警 了 也 没 用 ・</span></div>

  <div id="orange">🍊</div>
  <div id="hint">↑↑↑ 点 这 个 橙 子 ↑↑↑</div>

  <div class="deco" style="left:2%;top:32%;transform:rotate(-18deg)">🥐</div>
  <div class="deco" style="right:3%;top:22%;transform:rotate(24deg)">🥖</div>
  <div class="deco" style="left:6%;bottom:12%;transform:rotate(12deg)">🧀</div>
  <div class="deco" style="right:7%;bottom:14%;transform:rotate(-30deg)">🥯</div>
  <div class="deco" style="left:44%;top:8%;font-size:28px;opacity:.35;transform:rotate(6deg)">✨</div>

  <div id="bar">
    <div id="stats">已发射 <b id="n1">0</b> 个面包 ・ 已落地 <b id="n2">0</b> 个 ・ 现场混乱度 <b id="n3">0</b>%</div>
    <div class="bar-btns">
      <button id="btn-switch" class="ugly-btn" style="display:none">切 正 常 模 式</button>
      <button id="reset" class="ugly-btn">清 理 现 场</button>
    </div>
  </div>
</div>

<div id="ui-clean">
  <header class="c-head">
    <div class="c-logo"><span class="c-dot"></span>ojipan</div>
    <div class="c-actions">
      <button id="c-sound" class="c-pill">音效 开</button>
      <a class="c-pill" href="https://github.com/ShaddockNH3/ojipan" target="_blank" rel="noopener">源码</a>
    </div>
  </header>

  <main class="c-mid">
    <h1>橘子发射面包</h1>
    <p class="c-sub">点一下，把面包送到它该去的地方。</p>
    <button id="c-orange" aria-label="发射面包">
      <span class="c-body"></span>
      <span class="c-shine"></span>
      <span class="c-leaf"></span>
    </button>
    <div class="c-shadow"></div>
    <p class="c-tip">点击发射</p>
  </main>

  <div class="c-ground"></div>

  <footer class="c-foot">
    <div class="c-meter-head"><span>现场混乱度</span><span id="c-pct">0%</span></div>
    <div class="c-track"><div id="c-fill"></div></div>
    <div class="c-foot-row"><span id="c-count">已发射 0 个</span><button id="c-clear">清空现场</button></div>
  </footer>
</div>

<div id="sky"></div>

<div id="modal">
  <div class="m-box">
    <p class="m-title">停 一 下 ！</p>
    <p class="m-sub">现 场 混 乱 度 ・ 6 0 %</p>
    <p class="m-ask">要不要换个正常点的模式？</p>
    <div class="m-btns">
      <button id="m-yes" class="m-btn m-yes">换</button>
      <button id="m-no" class="m-btn m-no">不 换</button>
    </div>
  </div>
</div>

<div id="veil"></div>

<script>
(function () {
  var sky = document.getElementById('sky');
  var orange = document.getElementById('orange');
  var cOrb = document.getElementById('c-orange');
  var n1 = document.getElementById('n1'), n2 = document.getElementById('n2'), n3 = document.getElementById('n3');
  var cPct = document.getElementById('c-pct'), cFill = document.getElementById('c-fill'), cCount = document.getElementById('c-count');
  var modal = document.getElementById('modal');
  var veil = document.getElementById('veil');
  var btnSwitch = document.getElementById('btn-switch');

  var BREAD_SVG = '<svg viewBox="0 0 42 37" width="1.12em" height="0.99em" aria-hidden="true">' +
    '<path d="M5 14 Q5 5 12 5 Q17 5 20 8 Q23 5 29 5 Q37 5 37 14 V26 Q37 31 31 31 H11 Q5 31 5 26 Z" fill="#F6DDB4"/>' +
    '<path d="M5 14 Q5 5 12 5 Q17 5 20 8 Q23 5 29 5 Q37 5 37 14 V26 Q37 31 31 31 H11 Q5 31 5 26 Z" fill="none" stroke="#E4BC85" stroke-width="1.6"/>' +
    '<path d="M15 12 v12 M21 11 v13 M27 12 v12" stroke="#E4BC85" stroke-width="1.3" opacity="0.75" stroke-linecap="round"/></svg>';

  var mode = 'ugly';
  var soundOn = true;
  var asked = false;
  var crashed = false;
  var switching = false;
  var SNAP = false;
  var items = [];
  var launched = 0, landed = 0;
  var W = 0, H = 0, GY = 0;
  var WHACK = ['咚', '啪', '噗', '哐', '咻', '吧唧', '咚!', '啪!', '噗嗤', '轰'];

  function measure() {
    W = window.innerWidth;
    H = window.innerHeight;
    GY = H - (mode === 'clean' ? 118 : 56);
  }
  measure();
  window.addEventListener('resize', function () { measure(); realign(); });

  function confusion() { return Math.min(100, Math.round(landed * 6.5)); }

  var AC = null;
  function blip(f) {
    if (!soundOn) return;
    try {
      if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
      var o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;
      o.type = 'square';
      o.frequency.setValueAtTime(f, t);
      o.frequency.exponentialRampToValueAtTime(Math.max(60, f / 3), t + 0.16);
      g.gain.setValueAtTime(0.07, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.19);
      o.connect(g); g.connect(AC.destination);
      o.start(t); o.stop(t + 0.2);
    } catch (e) {}
  }

  function pop(x, y, txt, size) {
    var d = document.createElement('div');
    d.className = 'pop';
    d.textContent = txt;
    d.style.left = Math.min(Math.max(x, 44), W - 44) + 'px';
    d.style.top = y + 'px';
    if (size) d.style.fontSize = size + 'px';
    sky.appendChild(d);
    if (!document.body.classList.contains('snap')) {
      setTimeout(function () { d.remove(); }, 1000);
    }
  }

  function flash(txt) {
    var d = document.createElement('div');
    d.className = 'flash';
    d.textContent = txt;
    document.body.appendChild(d);
    setTimeout(function () { d.remove(); }, 1900);
  }

  function shot(ox, oy, power) {
    var size = 28 + Math.random() * 44;
    var angle = (-155 + Math.random() * 130) * Math.PI / 180;
    var sp = power || (13 + Math.random() * 15);
    var el = document.createElement('div');
    el.className = 'bread';
    el.innerHTML = '<span class="bd-e">' + (Math.random() < 0.15 ? '🥐' : (Math.random() < 0.1 ? '🥖' : '🍞')) + '</span>' + BREAD_SVG;
    el.style.fontSize = size + 'px';
    el.style.zIndex = 10 + Math.floor(Math.random() * 70);
    el.style.left = ox + 'px';
    el.style.top = oy + 'px';
    el.style.transform = 'translate(-50%,-50%) rotate(0deg)';
    sky.appendChild(el);

    items.push({
      el: el, x: ox, y: oy,
      vx: Math.cos(angle) * sp,
      vy: Math.sin(angle) * sp,
      rot: 0,
      vr: (Math.random() - 0.5) * 22,
      jit: Math.random() < 0.6 ? Math.random() * 40 : 0,
      size: size,
      bounces: 0,
      dead: false,
      gone: false
    });
    launched++;
    syncUI();
    blip(280 + Math.random() * 380);
  }

  function fire(n) {
    var el = (mode === 'clean') ? cOrb : orange;
    var r = el.getBoundingClientRect();
    var ox = r.left + r.width / 2;
    var oy = r.top + r.height / 2;
    for (var i = 0; i < n; i++) {
      (function (k) {
        setTimeout(function () { shot(ox, oy); }, k * 55);
      })(i);
    }
  }

  function syncUI() {
    var pct = confusion();
    n1.textContent = launched;
    n2.textContent = landed;
    n3.textContent = pct;
    cPct.textContent = pct + '%';
    cFill.style.width = pct + '%';
    cCount.textContent = '已发射 ' + launched + ' 个';
  }

  function checkTrigger() {
    var pct = confusion();
    if (mode === 'ugly' && !asked && pct >= 60) {
      asked = true;
      modal.classList.add('show');
      blip(880);
    }
    if (mode === 'clean' && !crashed && pct >= 100) {
      crashed = true;
      crashBack();
    }
  }

  function step() {
    var i, it;
    for (i = 0; i < items.length; i++) {
      it = items[i];
      if (it.dead || it.gone) continue;

      it.vy += 0.62;
      it.vx *= 0.9985;
      it.x += it.vx;
      it.y += it.vy;
      it.rot += it.vr;

      if (it.x < 14) { it.x = 14; it.vx = Math.abs(it.vx) * 0.62; it.vr *= -0.8; }
      if (it.x > W - 14) { it.x = W - 14; it.vx = -Math.abs(it.vx) * 0.62; it.vr *= -0.8; }

      if (it.y > H + 260) {
        it.el.remove();
        it.gone = true;
        continue;
      }

      var floor = GY - it.size * 0.34 - it.jit;
      if (it.y > floor && it.y < H + 200) {
        it.y = floor;
        if (Math.abs(it.vy) > 3.2) {
          it.vy = -it.vy * 0.42;
          it.vx *= 0.78;
          it.vr *= 0.55;
          it.bounces++;
          if (it.bounces === 1) {
            if (mode === 'ugly') pop(it.x, floor, WHACK[Math.floor(Math.random() * WHACK.length)], 18 + Math.random() * 14);
            blip(140);
          }
        } else {
          it.vy = 0;
          it.vx *= 0.72;
          it.vr *= 0.6;
          if (Math.abs(it.vx) < 0.35 && Math.abs(it.vr) < 0.6) {
            it.dead = true;
            it.vx = 0; it.vr = 0;
            landed++;
            syncUI();
            if (!SNAP) checkTrigger();
          }
        }
      }
    }
  }

  function paint() {
    for (var i = 0; i < items.length; i++) {
      var it = items[i];
      if (it.gone) continue;
      it.el.style.left = it.x.toFixed(1) + 'px';
      it.el.style.top = it.y.toFixed(1) + 'px';
      it.el.style.transform = 'translate(-50%,-50%) rotate(' + it.rot.toFixed(1) + 'deg)';
    }
  }

  function realign() {
    for (var i = 0; i < items.length; i++) {
      var it = items[i];
      if (it.dead) it.y = GY - it.size * 0.34 - it.jit;
    }
    paint();
  }

  function loop() {
    step();
    paint();
    var dirty = false;
    for (var i = 0; i < items.length; i++) { if (items[i].gone) { dirty = true; break; } }
    if (dirty) items = items.filter(function (x) { return !x.gone; });
    requestAnimationFrame(loop);
  }

  function switchMode(to, cb) {
    if (switching || to === mode) return;
    switching = true;
    veil.className = 'on ' + (to === 'clean' ? 'veil-light' : 'veil-dark');
    setTimeout(function () {
      mode = to;
      document.body.classList.remove('mode-ugly', 'mode-clean');
      document.body.classList.add('mode-' + to);
      measure();
      realign();
      syncUI();
      veil.className = '';
      switching = false;
      if (cb) setTimeout(cb, 140);
    }, 190);
  }

  function dumpAll() {
    for (var i = 0; i < items.length; i++) {
      var it = items[i];
      it.dead = false;
      it.vy = 9 + Math.random() * 9;
      it.vx = it.vx * 1.6 + (Math.random() - 0.5) * 8;
      it.vr = (Math.random() - 0.5) * 30;
    }
    launched = 0;
    landed = 0;
    syncUI();
  }

  function crashBack() {
    document.body.classList.add('crash');
    blip(90);
    setTimeout(function () {
      document.body.classList.remove('crash');
      dumpAll();
      switchMode('ugly', function () { flash('（装不下去了）'); });
    }, 320);
  }

  function clearAll() {
    items.forEach(function (it) { it.el.remove(); });
    items = [];
    launched = 0;
    landed = 0;
    asked = false;
    crashed = false;
    btnSwitch.style.display = 'none';
    syncUI();
  }

  orange.addEventListener('click', function (e) { e.preventDefault(); fire(Math.random() < 0.35 ? 3 : 1); });
  orange.addEventListener('mouseenter', function () { blip(660); });
  cOrb.addEventListener('click', function (e) { e.preventDefault(); fire(Math.random() < 0.35 ? 3 : 1); });
  cOrb.addEventListener('mouseenter', function () { blip(760); });

  document.getElementById('reset').addEventListener('click', function () { clearAll(); blip(180); });
  document.getElementById('c-clear').addEventListener('click', function () { clearAll(); blip(180); });

  document.getElementById('m-yes').addEventListener('click', function () {
    modal.classList.remove('show');
    switchMode('clean');
  });
  document.getElementById('m-no').addEventListener('click', function () {
    modal.classList.remove('show');
    btnSwitch.style.display = 'inline-block';
    flash('那 就 继 续 乱 下 去');
  });

  btnSwitch.addEventListener('click', function () { switchMode('clean'); });

  document.getElementById('c-sound').addEventListener('click', function () {
    soundOn = !soundOn;
    this.textContent = soundOn ? '音效 开' : '音效 关';
    if (soundOn) blip(720);
  });

  var QS = new URLSearchParams(location.search);

  if (QS.get('shot')) {
    SNAP = true;
    document.body.classList.add('snap');
    if (QS.get('mode') === 'clean') {
      mode = 'clean';
      document.body.classList.remove('mode-ugly');
      document.body.classList.add('mode-clean');
      measure();
    }
    var plan = mode === 'clean'
      ? [22, 26, 30, 19, 27, 24, 31, 20, 25, 28, 16]
      : [22, 18, 26, 30, 19, 24, 31, 17, 27, 20, 23, 25, 28, 16];
    var ox = W * 0.5, oy = mode === 'clean' ? H * 0.44 : H * 0.47;
    for (var p = 0; p < plan.length; p++) {
      shot(ox + (Math.random() - 0.5) * W * 0.24, oy, plan[p]);
    }
    for (var s = 0; s < 900; s++) step();
    paint();
    syncUI();
    if (QS.get('modal')) modal.classList.add('show');
  } else {
    requestAnimationFrame(loop);
    setTimeout(function () { fire(1); }, 420);
    setTimeout(function () { fire(2); }, 700);
  }
})();
</script>
</body>
</html>
